<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TallyNext</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/TallyNext.UI/tallynext.css" />
    <style>
        #blazor-error-ui { display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: .6rem 1rem; background: #fde8e6; color: #7a1b13; z-index: 1000; }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>
<body>
    <div id="app"><div style="padding:2rem; font-family: Segoe UI, sans-serif">Starting TallyNext…</div></div>

    <div id="blazor-error-ui">
        An unexpected error occurred. Your saved work is safe in the local database.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">✕</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
